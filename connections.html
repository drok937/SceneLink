<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Excel to JSON Parser</title>
  <style>
    textarea, pre {
      width: 100%;
      height: 150px;
      margin: 10px 0;
    }
    button {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Excel Show Data to JSON + Connection Generator</h1>

  <p>Paste your Excel table data here:</p>
  <textarea id="input"></textarea>
  <button onclick="parseAndGenerate()">Convert & Generate Connections</button>
  <button onclick="copyToClipboard()">Copy to Clipboard</button>
  <button onclick="downloadJSON()">Download JSON</button>

  <h3>Generated JSON:</h3>
  <pre id="output"></pre>

  <script>
  function normalizeDate(dateStr) {
  const parts = dateStr.trim().split("/");
  if (parts.length !== 3) {
    console.warn("Invalid date:", dateStr);
    return null;
  }

  const [month, day, year] = parts;
  if (!month || !day || !year) {
    console.warn("Incomplete date:", dateStr);
    return null;
  }

  const fullYear = year.length === 2 ? `20${year}` : year;
  return `${fullYear}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
}

function parseAndGenerate() {
  const input = document.getElementById("input").value.trim();
  const lines = input.split("\n").slice(1); // skip header

  const rawShows = lines.map(line => {
    const [id, date, venueRaw, bandsRaw] = line.split(/\t+/);
    const normDate = normalizeDate(date);
    if (!normDate) return null;

    const venue = venueRaw.replace(/[()]/g, '').trim();
    const bands = bandsRaw.split(',').map(b => b.trim()).filter(Boolean);
    return { id: Number(id), date: normDate, venue, bands };
  }).filter(Boolean); // remove nulls from invalid lines

  // 🧹 Remove duplicate shows based on date + sorted bands
  const seen = new Set();
  const uniqueShows = [];
  for (const show of rawShows) {
    const key = `${show.date}::${show.bands.join(",")}`;
    if (!seen.has(key)) {
      seen.add(key);
      uniqueShows.push(show);
    }
  }

  // 🎯 Count unique shows per band
  const bandShowCounts = {};
  for (const show of uniqueShows) {
    for (const band of show.bands) {
      bandShowCounts[band] = (bandShowCounts[band] || 0) + 1;
    }
  }

  // 🔗 Generate direct connections
  const pairings = {};
  uniqueShows.forEach(show => {
    const { bands } = show;
    for (let i = 0; i < bands.length; i++) {
      for (let j = i + 1; j < bands.length; j++) {
        const a = bands[i], b = bands[j];
        pairings[a] = pairings[a] || {};
        pairings[b] = pairings[b] || {};
        pairings[a][b] = (pairings[a][b] || 0) + 1;
        pairings[b][a] = (pairings[b][a] || 0) + 1;
      }
    }
  });

  // 🔁 Generate secondary connections
  // const secondaries = {};
  // for (const artist in pairings) {
  //   secondaries[artist] = {};
  //   for (const partner in pairings[artist]) {
  //     for (const maybeSecondary in pairings[partner]) {
  //       if (
  //         maybeSecondary !== artist &&
  //         !pairings[artist][maybeSecondary]
  //       ) {
  //         secondaries[artist][maybeSecondary] =
  //           (secondaries[artist][maybeSecondary] || 0) + 1;
  //       }
  //     }
  //   }
  // }

  // 🔁 Generate secondary connections based on all shows a band has ever played
const bandsPlayedWith = {};
for (const show of uniqueShows) {
  for (const band of show.bands) {
    bandsPlayedWith[band] = bandsPlayedWith[band] || new Set();
    for (const other of show.bands) {
      if (other !== band) bandsPlayedWith[band].add(other);
    }
  }
}

// Now, for each band, look at all "friends of friends" who are not direct connections
const secondaries = {};
for (const band in bandsPlayedWith) {
  secondaries[band] = {};
  // All bands this band has played with directly
  const direct = bandsPlayedWith[band];
  for (const friend of direct) {
    // All bands this friend has played with
    const friendsFriends = bandsPlayedWith[friend] || new Set();
    for (const maybeSecondary of friendsFriends) {
      if (
        maybeSecondary !== band &&
        !direct.has(maybeSecondary)
      ) {
        secondaries[band][maybeSecondary] = (secondaries[band][maybeSecondary] || 0) + 1;
      }
    }
  }
}

  // 🔍 Find max primary and secondary connection values
  let maxPConnections = 0;
  let maxSConnections = 0;

  for (const band in pairings) {
    for (const other in pairings[band]) {
      if (pairings[band][other] > maxPConnections) {
        maxPConnections = pairings[band][other];
      }
    }
  }

  for (const band in secondaries) {
    for (const other in secondaries[band]) {
      if (secondaries[band][other] > maxSConnections) {
        maxSConnections = secondaries[band][other];
      }
    }
  }

  // 📦 Final output
  const outputJSON = {
    shows: uniqueShows,
    directConnections: pairings,
    secondaryConnections: secondaries,
    bandShowCounts: bandShowCounts,
    maxPConnections: maxPConnections,
    maxSConnections: maxSConnections
  };

  document.getElementById("output").textContent = JSON.stringify(outputJSON, null, 2);
}


    function downloadJSON() {
      const dataStr = document.getElementById("output").textContent;
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "enriched-data.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copyToClipboard() {
  const output = document.getElementById("output").textContent;
  navigator.clipboard.writeText(output).then(() => {
    alert("JSON copied to clipboard!");
  }).catch(err => {
    console.error("Failed to copy JSON:", err);
    alert("Failed to copy JSON.");
  });
}
  </script>
</body>
</html>
